name: Build static Midnight Commander (Android arm64)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/mc-static.yml
      - app/src/main/assets/pkg
      - docs/pkg-index/**
      - tools/test-pkg-bundle.sh
  push:
    branches: [mc-build-test, mc-shared-data]
    paths:
      - .github/workflows/mc-static.yml
      - app/src/main/assets/pkg
      - docs/pkg-index/**
      - tools/test-pkg-bundle.sh

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autopoint binutils-aarch64-linux-gnu build-essential bison gettext libtool meson ninja-build pkg-config python3-pip qemu-user texinfo wget xz-utils
          python3 -m pip install --break-system-packages ziglang==0.13.0
      - name: Build static Android arm64 binary
        shell: bash
        run: |
          set -euxo pipefail
          export ZIG="$(python3 -c 'import ziglang, pathlib; print(pathlib.Path(ziglang.__file__).parent / "zig")')"
          export TARGET=aarch64-linux-musl
          export PREFIX="$GITHUB_WORKSPACE/prefix"
          export BUILD="$GITHUB_WORKSPACE/build"
          export STAGE="$GITHUB_WORKSPACE/stage"
          mkdir -p "$PREFIX/bin" "$PREFIX/lib/pkgconfig" "$BUILD" "$STAGE" "$GITHUB_WORKSPACE/dist"
          cat > "$PREFIX/bin/aarch64-linux-musl-cc" <<EOF
          #!/bin/sh
          case " \$* " in *" -Wl,--version "*) echo 'LLD 17.0.6 (compatible with GNU linkers)'; exit 0;; esac
          exec "$ZIG" cc -target "$TARGET" "\$@"
          EOF
          cat > "$PREFIX/bin/aarch64-linux-musl-c++" <<EOF
          #!/bin/sh
          exec "$ZIG" c++ -target "$TARGET" "\$@"
          EOF
          chmod +x "$PREFIX/bin/aarch64-linux-musl-cc" "$PREFIX/bin/aarch64-linux-musl-c++"
          export CC="$PREFIX/bin/aarch64-linux-musl-cc"
          export CXX="$PREFIX/bin/aarch64-linux-musl-c++"
          export AR="$ZIG ar"
          export RANLIB="$ZIG ranlib"
          export CFLAGS='-O2 -fPIE'
          export CXXFLAGS='-O2 -fPIE'
          export LDFLAGS='-static -static-pie -Wl,--gc-sections'
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PKG_CONFIG_PATH"
          export PKG_CONFIG_SYSROOT_DIR=/
          export PATH="$PREFIX/bin:$PATH"

          cd "$BUILD"
          wget -q https://github.com/libffi/libffi/releases/download/v3.4.6/libffi-3.4.6.tar.gz
          tar xf libffi-3.4.6.tar.gz
          cd libffi-3.4.6
          ./configure --host="$TARGET" --prefix="$PREFIX" --enable-static --disable-shared --disable-docs
          make -j2 && make install

          cd "$BUILD"
          wget -q https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.45/pcre2-10.45.tar.gz
          tar xf pcre2-10.45.tar.gz
          cd pcre2-10.45
          ./configure --host="$TARGET" --prefix="$PREFIX" --enable-static --disable-shared --disable-pcre2-16 --disable-pcre2-32 --disable-jit --disable-pcre2grep-libz --disable-pcre2grep-libbz2
          make -j2 && make install

          cd "$BUILD"
          wget -q https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar xf zlib-1.3.1.tar.gz
          cd zlib-1.3.1
          ./configure --static --prefix="$PREFIX"
          make -j2 && make install

          cd "$BUILD"
          wget -q https://download.gnome.org/sources/glib/2.82/glib-2.82.4.tar.xz
          tar xf glib-2.82.4.tar.xz
          cat > cross-file.txt <<EOF
          [binaries]
          c = ['$PREFIX/bin/aarch64-linux-musl-cc']
          cpp = ['$PREFIX/bin/aarch64-linux-musl-c++']
          c_ld = 'lld'
          cpp_ld = 'lld'
          ar = ['$ZIG', 'ar']
          strip = ['$ZIG', 'strip']
          pkg-config = 'pkg-config'
          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          [properties]
          needs_exe_wrapper = true
          [built-in options]
          c_args = ['-O2']
          c_link_args = ['-static', '-static-pie']
          EOF
          meson setup glib-build glib-2.82.4 --cross-file cross-file.txt --prefix="$PREFIX" --default-library=static -Dtests=false -Dinstalled_tests=false -Dman=false -Dgtk_doc=false -Dintrospection=disabled -Dselinux=disabled -Dlibmount=disabled -Dlibelf=disabled -Dnls=disabled -Dglib_debug=disabled
          ninja -C glib-build -j2 install

          cd "$BUILD"
          wget -q https://ftp.gnu.org/gnu/ncurses/ncurses-6.5.tar.gz
          tar xf ncurses-6.5.tar.gz
          cd ncurses-6.5
          ./configure --host="$TARGET" --prefix="$PREFIX" --with-shared=no --with-normal --without-cxx --without-cxx-binding --without-ada --without-manpages --without-tests --enable-widec
          make -j2 && make install.libs install.includes
          export CPPFLAGS="-I$PREFIX/include -I$PREFIX/include/ncursesw"
          export LDFLAGS="-L$PREFIX/lib -static -static-pie -Wl,--gc-sections"
          printf '#include <ncursesw/curses.h>\nint main(void) { return has_colors() ? 0 : 1; }\n' > "$BUILD/ncurses-probe.c"
          "$CC" $CFLAGS $CPPFLAGS $LDFLAGS -o "$BUILD/ncurses-probe" "$BUILD/ncurses-probe.c" -lncursesw

          cd "$BUILD"
          wget -q https://ftp.osuosl.org/pub/midnightcommander/mc-4.8.33.tar.xz
          tar xf mc-4.8.33.tar.xz
          cd mc-4.8.33
          if ! ./configure --host="$TARGET" --prefix=/data/local/tmp/Sshd4a --sysconfdir=/data/local/tmp/Sshd4a/share/mc/sysconf --libexecdir=/data/local/tmp/Sshd4a/share/mc/libexec --with-screen=ncursesw --with-search-engine=glib --disable-nls --disable-vfs-sftp; then tail -n 120 config.log; exit 1; fi
          make -j2
          make DESTDIR="$STAGE" install
          MC_PREFIX="$STAGE/data/local/tmp/Sshd4a"
          test -x "$MC_PREFIX/bin/mc"
          test -f "$MC_PREFIX/share/mc/skins/default.ini"
          cp "$MC_PREFIX/bin/mc" "$GITHUB_WORKSPACE/dist/mc"
          tar --dereference --hard-dereference --format=ustar -czf "$GITHUB_WORKSPACE/dist/mc-data.tar.gz" -C "$MC_PREFIX" share/mc
          tar -tzf "$GITHUB_WORKSPACE/dist/mc-data.tar.gz" | tee "$GITHUB_WORKSPACE/dist/mc-data-files.txt"
          grep -qx 'share/mc/skins/default.ini' "$GITHUB_WORKSPACE/dist/mc-data-files.txt"
          if tar -tzf "$GITHUB_WORKSPACE/dist/mc-data.tar.gz" | grep -Ev '^share/mc(/|$)' | grep -q .; then echo 'Unexpected path in MC shared data archive'; exit 1; fi
          python3 - "$GITHUB_WORKSPACE/dist/mc-data.tar.gz" <<'PY'
          import sys, tarfile
          with tarfile.open(sys.argv[1], 'r:gz') as archive:
              for member in archive.getmembers():
                  name = member.name.rstrip('/')
                  if name != 'share/mc' and not name.startswith('share/mc/'):
                      raise SystemExit(f'Unexpected archive path: {member.name}')
                  if '..' in name.split('/') or not (member.isdir() or member.isfile()):
                      raise SystemExit(f'Unsafe archive member: {member.name}')
          PY
          aarch64-linux-gnu-strip "$GITHUB_WORKSPACE/dist/mc"
          file "$GITHUB_WORKSPACE/dist/mc" | tee "$GITHUB_WORKSPACE/dist/build-info.txt"
          readelf -l "$GITHUB_WORKSPACE/dist/mc" | tee -a "$GITHUB_WORKSPACE/dist/build-info.txt"
          if readelf -l "$GITHUB_WORKSPACE/dist/mc" | grep -q INTERP; then echo 'Unexpected dynamic ELF interpreter'; exit 1; fi
          if readelf -d "$GITHUB_WORKSPACE/dist/mc" 2>/dev/null | grep -q NEEDED; then echo 'Unexpected dynamic dependency'; exit 1; fi
          TERM=xterm-256color qemu-aarch64 "$GITHUB_WORKSPACE/dist/mc" --version
          TERM=xterm-256color qemu-aarch64 "$GITHUB_WORKSPACE/dist/mc" --help >/dev/null
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum mc mc-data.tar.gz > SHA256SUMS && cat SHA256SUMS)
          sh "$GITHUB_WORKSPACE/tools/test-pkg-bundle.sh" "$GITHUB_WORKSPACE/app/src/main/assets/pkg" "$GITHUB_WORKSPACE/dist/mc" "$GITHUB_WORKSPACE/dist/mc-data.tar.gz"
          tar -C "$GITHUB_WORKSPACE/dist" -czf "$GITHUB_WORKSPACE/mc-4.8.33-android-arm64.tar.gz" mc mc-data.tar.gz SHA256SUMS build-info.txt mc-data-files.txt
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc-4.8.33-android-arm64-test
          path: mc-4.8.33-android-arm64.tar.gz
          if-no-files-found: error
