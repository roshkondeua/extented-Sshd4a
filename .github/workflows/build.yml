name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;30.0.14904198"
          sdkmanager "cmake;4.1.2"
          echo "$ANDROID_HOME/cmake/4.1.2/bin" >> "$GITHUB_PATH"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Prebuild native sources
        run: |
          chmod +x app/src/main/cpp/prebuild-rsyn.sh app/src/main/cpp/prebuild-dropbear.sh
          app/src/main/cpp/prebuild-rsyn.sh
          app/src/main/cpp/prebuild-dropbear.sh

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Write signing properties
        run: |
          cat > Sshd4a.properties <<EOF
          sign.storeFile=$RUNNER_TEMP/release.keystore
          sign.storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          sign.keyAlias=${{ secrets.KEY_ALIAS }}
          sign.keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          mkdir -p ~/.gradle
          echo "Sshd4a.properties=$PWD/Sshd4a.properties" >> ~/.gradle/gradle.properties

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sshd4a-fork-release
          path: app/build/outputs/apk/release/*.apk

      # Раскомментировать, если нужен постоянный релиз вместо просто artifact:
