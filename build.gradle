plugins {
    alias libs.plugins.android.application apply false
    alias libs.plugins.android.kotlin apply false
}

tasks.register("clean", Delete) {
    delete(rootProject.layout.buildDirectory)
}

ext {
    applicationId = "com.hardbacknutter.sshd"
    applicationVersionCode = 16
    applicationVersionName = "1.10.0"

    toolChain = 21

    // Android 11 as minimum... there are far too many issues/differences dealing
    // with storage permissions if we try for Android 10 or lower
    // See https://developer.android.com/training/data-storage
    minSdkVersion = 30
    targetSdkVersion = 36
    compileSdkVersion = 36

    // https://developer.android.com/studio/projects/configure-agp-ndk
    ndk = "29.0.14206865"
    // don't forget to update CMakeLists.txt cmake_minimum_required
    cmakeVersion = "4.1.2"
}